name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      has_deploy: ${{ steps.changes.outputs.has_deploy }}
      targets: ${{ steps.changes.outputs.targets }}
      data: ${{ steps.revisions.outputs.data }}
      backend: ${{ steps.revisions.outputs.backend }}
      frontend: ${{ steps.revisions.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: green-business-solution/retrofi_data
          path: retrofi_data
      - uses: actions/checkout@v7
        with:
          repository: green-business-solution/retrofi_backend
          path: retrofi_backend
      - uses: actions/checkout@v7
        with:
          repository: green-business-solution/retrofi_frontend
          path: retrofi_frontend
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install and link sibling repositories
        run: |
          npm ci --prefix retrofi_frontend
          npm ci --prefix retrofi_backend
          npm run setup --prefix retrofi_frontend
          npm run setup --prefix retrofi_backend
      - name: Select production changes
        id: changes
        working-directory: retrofi_backend
        env:
          SOURCE_REPOSITORY: retrofi_frontend
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/select-split-deploy-targets.mjs
      - name: Record tested revisions
        id: revisions
        run: |
          echo "data=$(git -C retrofi_data rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "backend=$(git -C retrofi_backend rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(git -C retrofi_frontend rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify retrofi_frontend
        run: |
          npm run typecheck --prefix retrofi_frontend
          npm test --prefix retrofi_frontend
          npm run build --prefix retrofi_frontend
          npm audit --prefix retrofi_frontend --omit=dev --audit-level=high
  deploy:
    needs: checks
    if: needs.checks.outputs.has_deploy == 'true' && vars.RETROFI_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: retrofi-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: green-business-solution/retrofi_data
          path: retrofi_data
          ref: ${{ needs.checks.outputs.data }}
      - uses: actions/checkout@v7
        with:
          repository: green-business-solution/retrofi_backend
          path: retrofi_backend
          ref: ${{ needs.checks.outputs.backend }}
      - uses: actions/checkout@v7
        with:
          repository: green-business-solution/retrofi_frontend
          path: retrofi_frontend
          ref: ${{ needs.checks.outputs.frontend }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install and link sibling repositories
        run: |
          npm ci --prefix retrofi_frontend
          npm ci --prefix retrofi_backend
          npm run setup --prefix retrofi_frontend
          npm run setup --prefix retrofi_backend
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::059310317821:role/gbs-github-actions-deploy
          aws-region: us-east-1
      - name: Deploy frontend
        working-directory: retrofi_backend
        env:
          DEPLOY_TARGETS: ${{ needs.checks.outputs.targets }}
          AWS_PROFILE: ''
          AWS_DEPLOY_REGION: us-east-1
          GBS_AWS_REGION: us-east-2
        run: npm run deploy:production -- $DEPLOY_TARGETS
      - name: Smoke check
        run: |
          curl --fail --silent --show-error https://retrofi.org/ -o /dev/null
          curl --fail --silent --show-error https://retrofi.org/api/health | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{if(JSON.parse(s).ok!==true)process.exit(1)})'
